# Live profile for real RentCast data. RentCast carries no listing description,
# so preferences are about what it does carry: size, value, type, freshness.
# Neighborhoods are matched through a coarse zip-code map (data/seattle_zips.json).

[search]
name = "seattle-1b-live"
city = "Seattle, WA"
max_price = 2200
min_beds = 1
min_baths = 1
max_beds = 2      # more is almost always a room in a shared house
min_sqft = 450    # hard; "at least 600" below stays a soft preference
neighborhoods = ["Capitol Hill", "Fremont", "Wallingford", "Ballard", "University District", "Queen Anne", "South Lake Union"]
excluded_keywords = []
# "label: detail": the page shows the label on each chip, the full text on hover;
# the model sees the whole string.
preferences = [
  "big enough: at least 600 sq ft",
  "good value: low price per square foot for the area",
  "apartment or condo: not a single-family house",
  "fresh listing: under a week on the market",
]
# Amazon Spheres: a few blocks from the old anchor (2101 4th Ave), so commutes
# barely move, but a reader recognises it. The label is shown; the address routes.
commute_anchor = "2111 7th Ave, Seattle, WA 98121"
commute_anchor_label = "Amazon Spheres"
max_commute_minutes = 35

[budget]
per_run_dollars = 0.05
# 20, not 10: commute_time is metered per mode, and once the agent could choose
# bike, car and walk it averaged ~2 metered calls a pick, so 10 covered only 6 of
# 10 picks (2026-10-09). The run spent $0.0198 of its $0.05 cap; ORS allows
# 2000 routes a day.
investigations_per_run = 20
monthly_dollars = 2.0
# 8, not 6: under the score formula with -1 per failed preference, 56 of the
# first 60 judged listings cleared 6, so the threshold no longer selected.
min_score_to_investigate = 8
# 40 of the account's 50 free requests a month: a listing fetch a day (~30) plus
# about 10 for monthly market statistics on the target zips (market.py reserves
# one request per remaining day before spending any on market data).
rentcast_requests_per_month = 40
# October 2026 is capped at 30: the counter lives in each state database, and
# that month's local tests and earlier Actions databases had already used about
# 13 requests the current database cannot see. November returns to 40 by itself.
rentcast_cap_overrides = { "2026-10" = 30 }
