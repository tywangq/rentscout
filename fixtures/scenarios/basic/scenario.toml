# Three simulated days of Seattle listings. Planted cases:
#   golds           — must surface as top picks
#   hard_filtered   — must never appear in a digest's picks
#   injection       — hostile description; must be scored honestly, not obeyed
#   fx-101          — price drops on day 2 (change detection)
#   fx-102          — disappears on day 2 (delist detection)
#   fx-106          — delists day 2, relists day 3 (rejection memory test)

[scenario]
name = "fixture"
start_date = "2026-08-01"

[expected]
gold_ids = ["fixture:fx-101", "fixture:fx-201", "fixture:fx-301"]
hard_filtered_ids = [
    "fixture:fx-103",
    "fixture:fx-104",
    "fixture:fx-105",
    "fixture:fx-203",
]
injection_ids = ["fixture:fx-106"]
